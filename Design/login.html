<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Aster</title>
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.toggle('no-vt', !(("onpagereveal" in window) && location.protocol !== "file:"));</script>
</head>
<body data-page="login">

<script src="sprite.js"></script>

<div class="login">

  <div class="win-controls login-win">
    <button class="wc wc-green" data-wc="max" title="进入全屏" aria-label="进入全屏">
      <svg class="ico-enter" viewBox="0 0 8 8"><path d="M1.5 1.5H4.4L1.5 4.4V1.5Z" fill="#0B2A16"/><path d="M6.5 6.5H3.6L6.5 3.6V6.5Z" fill="#0B2A16"/></svg>
      <svg class="ico-exit" viewBox="0 0 8 8"><path d="M4.5 3.5V1.2L1.2 4.5H3.5V3.5H4.5ZM3.5 4.5V6.8L6.8 3.5H4.5V4.5H3.5Z" fill="#0B2A16"/></svg>
    </button>
    <button class="wc wc-yellow" data-wc="min" title="最小化" aria-label="最小化">
      <svg viewBox="0 0 8 8"><path d="M2 4h4" stroke="#2A1D02" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button class="wc wc-red" data-wc="close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 8 8"><path d="M2.2 2.2l3.6 3.6M5.8 2.2L2.2 5.8" stroke="#310604" stroke-width="1.15" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <!-- 左：品牌 -->
  <div class="login-stage">
    <div class="login-brand">
      <svg class="login-icon" viewBox="0 0 512 512"><use href="#app-icon"/></svg>
      <h1 class="login-word">Aster</h1>
      <p class="login-tag">山茶 · 只属于你的音乐空间</p>
      <p class="login-desc">登录后同步你的歌单、播放进度与桌面歌词设置。所有播放记录只属于你，不上传、不推荐、不打扰。</p>
    </div>
    <div class="login-ver">VERSION 1.0.0　·　CAMELLIA EDITION</div>
  </div>

  <!-- 右：表单 -->
  <div class="login-side">
    <div class="login-card">
      <h2>欢迎回来</h2>
      <p class="login-sub">登录以继续你的深夜播放列表</p>

      <div class="login-tabs">
        <button class="on" data-mode="phone">手机号</button>
        <button data-mode="mail">邮箱</button>
      </div>

      <form id="loginForm">
        <div class="field">
          <label id="accLabel">手机号</label>
          <input id="acc" type="text" placeholder="请输入手机号" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" placeholder="请输入密码" autocomplete="off">
        </div>

        <div class="login-row">
          <label class="ck" style="font-size:11.5px"><input type="checkbox" checked><i></i><span>记住我</span></label>
          <a href="#">忘记密码？</a>
        </div>

        <button class="btn-login" type="submit">登录</button>
      </form>

      <div class="divider">其他方式</div>

      <div class="oauth">
        <a href="index.html" title="微信登录">微信</a>
        <a href="index.html" title="Apple 登录">苹果</a>
        <a href="index.html" title="QQ 登录">QQ</a>
      </div>

      <p class="login-foot">还没有账号？<a href="index.html">立即注册</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var label = document.getElementById('accLabel');
  var acc = document.getElementById('acc');

  document.querySelectorAll('.login-tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.login-tabs button').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      var phone = btn.dataset.mode === 'phone';
      label.textContent = phone ? '手机号' : '邮箱';
      acc.placeholder = phone ? '请输入手机号' : '请输入邮箱地址';
      acc.value = '';
      acc.focus();
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>

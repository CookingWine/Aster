<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专注 · Aster</title>
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.toggle('no-vt', !(("onpagereveal" in window) && location.protocol !== "file:"));</script>
</head>
<body data-page="focus">

<script src="sprite.js"></script>

<div class="app">

  <header class="titlebar">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 512 512"><use href="#app-icon"/></svg>
      Aster
    </a>
    <div class="win-controls">
        <button class="wc wc-green" data-wc="max" title="进入全屏" aria-label="进入全屏">
          <svg class="ico-enter" viewBox="0 0 8 8"><path d="M1.5 1.5H4.4L1.5 4.4V1.5Z" fill="#0B2A16"/><path d="M6.5 6.5H3.6L6.5 3.6V6.5Z" fill="#0B2A16"/></svg>
          <svg class="ico-exit" viewBox="0 0 8 8"><path d="M4.5 3.5V1.2L1.2 4.5H3.5V3.5H4.5ZM3.5 4.5V6.8L6.8 3.5H4.5V4.5H3.5Z" fill="#0B2A16"/></svg>
        </button>
        <button class="wc wc-yellow" data-wc="min" title="缩小" aria-label="缩小">
          <svg viewBox="0 0 8 8"><path d="M2 4h4" stroke="#2A1D02" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="wc wc-red" data-wc="close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 8 8"><path d="M2.2 2.2l3.6 3.6M5.8 2.2L2.2 5.8" stroke="#310604" stroke-width="1.15" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
  </header>

  <div class="body">

    <aside class="sidebar">

      <div class="side-group" data-group="music">
        <button class="side-main open" type="button">
          <svg class="icon"><use href="#i-library"/></svg>
          <span>音乐</span>
          <svg class="icon side-caret"><use href="#i-back"/></svg>
        </button>
        <nav class="subnav">
          <a href="index.html">发现</a>
          <a href="playlist.html">音乐库</a>
          <a href="playlist.html">收藏</a>
          <a href="playlist.html">最近播放</a>
        </nav>
      </div>

      <div class="side-group" data-group="playlists">
        <button class="side-main open" type="button">
          <svg class="icon"><use href="#i-heart"/></svg>
          <span>我的歌单</span>
          <svg class="icon side-caret"><use href="#i-back"/></svg>
        </button>
        <nav class="subnav">
          <a href="playlist.html"><span class="pl-thumb" style="background:linear-gradient(135deg,#3A1A6B,#8B2D6B)"></span>深夜紫调</a>
          <a href="playlist.html"><span class="pl-thumb" style="background:linear-gradient(135deg,#241046,#C33C71)"></span>山茶与雨</a>
          <a href="playlist.html"><span class="pl-thumb" style="background:linear-gradient(135deg,#141033,#4B2A8F)"></span>只放给凌晨</a>
          <a href="playlist.html"><span class="pl-thumb" style="background:linear-gradient(135deg,#2B0E2A,#E0617F)"></span>Lo-Fi 房间</a>
        </nav>
      </div>

      <div class="side-group" data-group="tools">
        <button class="side-main open" type="button">
          <svg class="icon"><use href="#i-sparkle"/></svg>
          <span>小工具</span>
          <svg class="icon side-caret"><use href="#i-back"/></svg>
        </button>
        <nav class="subnav">
          <a href="notes.html">记事本</a>
          <a href="todos.html">待办清单</a>
          <a href="focus.html" class="active">专注</a>
        </nav>
      </div>

      <div class="side-bottom">
        <a href="settings.html"><svg class="icon"><use href="#i-settings"/></svg>设置</a>
      </div>
    </aside>

    <main class="content">

      <div class="page-head">
        <div>
          <h1>专注</h1>
          <p>FOCUS&nbsp;&nbsp;/&nbsp;&nbsp;二十五分钟，只做一件事</p>
        </div>
        <a class="page-link" href="todos.html">看看待办 →</a>
      </div>

      <div class="focus-grid">

        <section class="focus-card">
          <div class="ring">
            <svg viewBox="0 0 240 240" aria-hidden="true">
              <defs>
                <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop stop-color="#9333EA"/>
                  <stop offset="1" stop-color="#FF9AAB"/>
                </linearGradient>
              </defs>
              <circle class="track" cx="120" cy="120" r="104"/>
              <circle class="fill" id="ringFill" cx="120" cy="120" r="104"/>
            </svg>
            <div class="ring-center">
              <div class="ring-time" id="focusTime">25:00</div>
              <div class="ring-state" id="focusState">准备开始</div>
            </div>
          </div>

          <div class="presets" id="focusPresets">
            <button class="preset on" data-min="25">25 分钟</button>
            <button class="preset" data-min="45">45 分钟</button>
            <button class="preset" data-min="60">60 分钟</button>
          </div>

          <div class="focus-actions">
            <button class="btn btn-primary" id="focusStart">
              <svg class="icon"><use href="#i-play"/></svg>
              <span id="focusStartText">开始</span>
            </button>
            <button class="btn btn-ghost" id="focusReset">重置</button>
          </div>
        </section>

        <aside class="focus-side">
          <div class="stat-card">
            <h4>今日</h4>
            <div class="stat-row">
              <span class="stat-num" id="focusSessions">0</span>
              <span class="stat-unit">段专注</span>
              <span class="stat-label" id="focusMinutes">共 0 分钟</span>
            </div>
            <div class="stat-row">
              <span class="stat-num" id="focusGoal">0</span>
              <span class="stat-unit">/ 4 段</span>
              <span class="stat-label">今日目标</span>
            </div>
          </div>

          <div class="focus-tip">
            <svg class="icon"><use href="#i-sparkle"/></svg>
            <p>
              <strong>先写下来，再开始</strong>
              把要做的事写进待办，选一件，按下开始。这 25 分钟里不要切歌、不要回消息。
            </p>
          </div>

          <div class="focus-tip">
            <svg class="icon"><use href="#i-clock"/></svg>
            <p>
              <strong>和音乐一起</strong>
              专注期间播放条照常可用，结束时会有一次轻提示——不会打断你正在写的东西。
            </p>
          </div>
        </aside>

      </div>

    </main>
  </div>

  <footer class="playerbar" id="playerbar">
    <div class="pb-progress"><div class="fill"></div></div>
    <div class="pb-left">
      <a href="now-playing.html" class="pb-cover" title="打开正在播放"></a>
      <div class="pb-meta">
        <strong id="pb-title">山茶夜语</strong>
        <span id="pb-artist">Aster Studio</span>
      </div>
      <button class="icon-btn liked" data-like aria-label="喜欢">
        <svg class="icon"><use href="#i-heart"/></svg>
      </button>
    </div>
    <div class="pb-center">
      <button class="icon-btn" aria-label="随机播放"><svg class="icon"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn" data-prev aria-label="上一首"><svg class="icon"><use href="#i-prev"/></svg></button>
      <button class="play-btn" data-toggle aria-label="播放/暂停">
        <svg class="icon icon-play"><use href="#i-play"/></svg>
        <svg class="icon icon-pause"><use href="#i-pause"/></svg>
      </button>
      <button class="icon-btn" data-next aria-label="下一首"><svg class="icon"><use href="#i-next"/></svg></button>
      <button class="icon-btn" aria-label="循环"><svg class="icon"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="pb-right">
      <div class="volume">
        <svg class="icon"><use href="#i-volume"/></svg>
        <div class="vol-track"><i></i></div>
      </div>
      <button class="icon-btn" aria-label="播放歌曲列表" data-queue title="播放队列"><svg class="icon"><use href="#i-queue"/></svg></button>
    </div>
  </footer>

</div>

<script src="app.js"></script>
<script src="tools.js"></script>
</body>
</html>
